<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undertale Boss Fight</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      width: 640px;
      background: #000;
      border: 2px solid #333;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    #boss-canvas {
      background: #000;
      display: block;
      margin-bottom: 10px;
    }
    #dialogue-box {
      width: 600px;
      height: 70px;
      border: 3px solid #fff;
      background: #000;
      padding: 10px;
      font-size: 16px;
      color: #fff;
      margin-bottom: 10px;
      line-height: 1.3;
      overflow: hidden;
    }
    #arena-container {
      position: relative;
      width: 600px;
      height: 180px;
      margin-bottom: 15px;
    }
    #arena-canvas {
      border: 5px solid #fff;
      background: #000;
      display: block;
    }
    #stats-bar {
      width: 600px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .hp-bar-outer {
      width: 120px;
      height: 20px;
      background: #c00;
      display: inline-block;
      vertical-align: middle;
      position: relative;
    }
    .hp-bar-inner {
      height: 100%;
      background: #ff0;
      width: 100%;
    }
    #menu-buttons {
      width: 600px;
      display: flex;
      justify-content: space-between;
    }
    .btn {
      width: 135px;
      height: 42px;
      border: 3px solid #e76e00;
      background: #000;
      color: #e76e00;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn:hover:not(:disabled) {
      color: #ff0;
      border-color: #ff0;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #555 !important;
      color: #555 !important;
    }
    #sub-menu {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 590px;
      height: 170px;
      background: #000;
      border: 3px solid #fff;
      display: none;
      flex-direction: column;
      padding: 15px;
      gap: 12px;
      z-index: 10;
    }
    .menu-option {
      cursor: pointer;
      font-size: 18px;
    }
    .menu-option:hover {
      color: #ff0;
    }
    #strike-bar-container {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 590px;
      height: 170px;
      background: #000;
      border: 3px solid #fff;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #strike-bg {
      width: 500px;
      height: 30px;
      border: 2px solid #fff;
      position: relative;
      background: linear-gradient(90deg, #f00, #ff0 45%, #fff 50%, #ff0 55%, #f00);
    }
    #strike-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 100%;
      background: #fff;
      box-shadow: 0 0 8px #fff;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="boss-canvas" width="600" height="150"></canvas>
  <div id="dialogue-box">Джордж Шлойт блокирует ваш путь...</div>
  
  <div id="arena-container">
    <canvas id="arena-canvas" width="600" height="180"></canvas>
    
    <div id="sub-menu"></div>
    
    <div id="strike-bar-container">
      <div id="strike-bg">
        <div id="strike-line"></div>
      </div>
    </div>
  </div>

  <div id="stats-bar">
    <span>ФРИСК</span>
    <span>УР 1</span>
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:14px;">ОЗ</span>
      <div class="hp-bar-outer"><div id="player-hp-bar" class="hp-bar-inner"></div></div>
      <span id="player-hp-text">50 / 50</span>
    </div>
  </div>

  <div id="menu-buttons">
    <button id="btn-fight" class="btn" onclick="openFight()">⚔️ АТАКА</button>
    <button id="btn-act" class="btn" onclick="openAct()">💬 ДЕЙСТВИЕ</button>
    <button id="btn-item" class="btn" onclick="openItem()">🍎 ВЕЩИ</button>
    <button id="btn-mercy" class="btn" onclick="openMercy()">💛 ПОЩАДА</button>
  </div>
</div>

<script>
  const bossCanvas = document.getElementById('boss-canvas');
  const bossCtx = bossCanvas.getContext('2d');
  const arenaCanvas = document.getElementById('arena-canvas');
  const arenaCtx = arenaCanvas.getContext('2d');

  const dialogueBox = document.getElementById('dialogue-box');
  const subMenu = document.getElementById('sub-menu');
  const strikeContainer = document.getElementById('strike-bar-container');
  const strikeLine = document.getElementById('strike-line');

  let playerHp = 50;
  const maxPlayerHp = 50;
  let bossHp = 450;
  const maxBossHp = 450;

  let isPlayerTurn = true;
  let isAttacking = false;
  let isMerciful = false;
  let respectedCount = 0;

  // Сердечко (Душа)
  const soul = {
    x: 300,
    y: 90,
    size: 16,
    speed: 3.2,
    color: '#f00'
  };

  const keys = {};

  window.addEventListener('keydown', e => { keys[e.key] = true; });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  let bullets = [];
  let bossColorState = 'normal'; // 'normal', 'red', 'purple'
  let bossHurtTimer = 0;

  function drawBoss() {
    bossCtx.clearRect(0, 0, bossCanvas.width, bossCanvas.height);

    let mainColor = '#ffffff';
    const hpRatio = bossHp / maxBossHp;

    if (bossColorState === 'red') {
      mainColor = '#ff4444';
    } else if (hpRatio < 0.8) {
      // Плавный перевод в фиолетовый
      const purpleIntensity = Math.floor((1 - hpRatio) * 200);
      mainColor = `rgb(${255 - purpleIntensity}, ${100}, ${255})`;
    }

    if (bossHurtTimer > 0) {
      bossHurtTimer--;
      mainColor = '#ff0000';
    }

    bossCtx.save();
    bossCtx.translate(300, 75);

    // Легкое покачивание
    const bounce = Math.sin(Date.now() / 300) * 3;
    bossCtx.translate(0, bounce);

    // Голова / Лицо
    bossCtx.fillStyle = mainColor;
    bossCtx.fillRect(-35, -45, 70, 70);

    // Волосы / Контур
    bossCtx.fillStyle = '#000';
    bossCtx.fillRect(-37, -47, 74, 12);
    bossCtx.fillRect(-35, 20, 70, 10); // Борода

    // Глаза
    bossCtx.fillStyle = '#000';
    bossCtx.fillRect(-22, -20, 12, 10);
    bossCtx.fillRect(10, -20, 12, 10);

    // Худи
    bossCtx.fillStyle = mainColor;
    bossCtx.fillRect(-50, 30, 100, 45);
    bossCtx.fillStyle = '#000';
    bossCtx.fillRect(-50, 45, 100, 12); // Серая/черная полоса на худи

    bossCtx.restore();
  }

  function setButtonsDisabled(disabled) {
    document.getElementById('btn-fight').disabled = disabled;
    document.getElementById('btn-act').disabled = disabled;
    document.getElementById('btn-item').disabled = disabled;
    document.getElementById('btn-mercy').disabled = disabled;
  }

  function updateHPDisplay() {
    document.getElementById('player-hp-text').innerText = `${playerHp} / ${maxPlayerHp}`;
    const pct = Math.max(0, (playerHp / maxPlayerHp) * 100);
    document.getElementById('player-hp-bar').style.width = `${pct}%`;
  }

  function closeSubMenu() {
    subMenu.style.display = 'none';
    subMenu.innerHTML = '';
  }

  function openFight() {
    if (!isPlayerTurn || isAttacking) return;
    setButtonsDisabled(true);
    closeSubMenu();

    strikeContainer.style.display = 'flex';
    let pos = 0;
    let dir = 6;
    
    const anim = setInterval(() => {
      pos += dir;
      if (pos > 490 || pos < 0) dir *= -1;
      strikeLine.style.left = `${pos}px`;
    }, 16);

    const handleStrike = (e) => {
      if (e.key === ' ' || e.type === 'click') {
        window.removeEventListener('keydown', handleStrike);
        strikeContainer.removeEventListener('click', handleStrike);
        clearInterval(anim);

        const accuracy = Math.abs(pos - 245);
        let dmg = Math.max(5, Math.floor(60 - accuracy / 4));
        bossHp = Math.max(0, bossHp - dmg);
        bossHurtTimer = 15;

        dialogueBox.innerText = `Вы нанесли ${dmg} урона!`;
        strikeContainer.style.display = 'none';

        setTimeout(() => {
          if (bossHp <= 0) {
            dialogueBox.innerText = 'Джордж Шлойт повержен!';
          } else {
            startEnemyTurn();
          }
        }, 1200);
      }
    };

    setTimeout(() => {
      window.addEventListener('keydown', handleStrike);
      strikeContainer.addEventListener('click', handleStrike);
    }, 100);
  }

  function openAct() {
    if (!isPlayerTurn || isAttacking) return;
    setButtonsDisabled(true);

    subMenu.style.display = 'flex';
    subMenu.innerHTML = `
      <div class="menu-option" onclick="doAct('check')">* Проверить</div>
      <div class="menu-option" onclick="doAct('breathe')">* Совместный вдох</div>
      <div class="menu-option" onclick="doAct('respect')">* Выказать уважение</div>
    `;
  }

  function doAct(type) {
    closeSubMenu();
    if (type === 'check') {
      dialogueBox.innerText = `Джордж Шлойт - АТАКА 15 ЗАЩИТА 10. Повелитель воздушных потоков.`;
    } else if (type === 'breathe') {
      dialogueBox.innerText = `Вы делаете глубокий вдох вместе с боссом. Атаки становятся споконее.`;
    } else if (type === 'respect') {
      respectedCount++;
      dialogueBox.innerText = `Вы выказали уважение. Атмосфера смягчается.`;
      if (respectedCount >= 2) {
        isMerciful = true;
      }
    }
    setTimeout(startEnemyTurn, 1500);
  }

  function openItem() {
    if (!isPlayerTurn || isAttacking) return;
    setButtonsDisabled(true);

    subMenu.style.display = 'flex';
    subMenu.innerHTML = `
      <div class="menu-option" onclick="useItem('pie')">* Легендарный пирог (+30 ОЗ)</div>
      <div class="menu-option" onclick="useItem('tea')">* Морской чай (+20 ОЗ)</div>
    `;
  }

  function useItem(item) {
    closeSubMenu();
    if (item === 'pie') {
      playerHp = Math.min(maxPlayerHp, playerHp + 30);
      dialogueBox.innerText = `Вы съели пирог. Восстановлено 30 ОЗ!`;
    } else {
      playerHp = Math.min(maxPlayerHp, playerHp + 20);
      dialogueBox.innerText = `Вы выпили чай. Восстановлено 20 ОЗ!`;
    }
    updateHPDisplay();
    setTimeout(startEnemyTurn, 1500);
  }

  function openMercy() {
    if (!isPlayerTurn || isAttacking) return;
    setButtonsDisabled(true);

    subMenu.style.display = 'flex';
    const color = isMerciful ? '#ff0' : '#fff';
    subMenu.innerHTML = `
      <div class="menu-option" style="color:${color}" onclick="doMercy()">* Пощада</div>
    `;
  }

  function doMercy() {
    closeSubMenu();
    if (isMerciful) {
      dialogueBox.innerText = `Вы пощадили Джорджа Шлойта! ПОБЕДА!`;
    } else {
      dialogueBox.innerText = `Имя босса еще не желтое...`;
      setTimeout(startEnemyTurn, 1500);
    }
  }

  function startEnemyTurn() {
    isPlayerTurn = false;
    isAttacking = true;
    setButtonsDisabled(true);
    bossColorState = 'red';

    bullets = [];
    soul.x = 300;
    soul.y = 90;

    dialogueBox.innerText = `Джордж Шлойт атаковал воздухом!`;

    // Спавн воздушных атак
    for (let i = 0; i < 8; i++) {
      bullets.push({
        x: Math.random() * 560 + 20,
        y: -20 - i * 35,
        vx: (Math.random() - 0.5) * 1.5,
        vy: 1.8 + Math.random() * 0.8,
        radius: 10
      });
    }

    let duration = 250; // Время хода атаки
    const attackInterval = setInterval(() => {
      duration--;
      if (duration <= 0) {
        clearInterval(attackInterval);
        endEnemyTurn();
      }
    }, 16);
  }

  function endEnemyTurn() {
    bullets = [];
    isAttacking = false;
    isPlayerTurn = true;
    bossColorState = 'normal';
    setButtonsDisabled(false);
    dialogueBox.innerText = `Ваш ход! Выберите действие.`;
  }

  function updateSoul() {
    if (!isAttacking) return;

    if ((keys['ArrowLeft'] || keys['a']) && soul.x - soul.size > 0) soul.x -= soul.speed;
    if ((keys['ArrowRight'] || keys['d']) && soul.x + soul.size < arenaCanvas.width) soul.x += soul.speed;
    if ((keys['ArrowUp'] || keys['w']) && soul.y - soul.size > 0) soul.y -= soul.speed;
    if ((keys['ArrowDown'] || keys['s']) && soul.y + soul.size < arenaCanvas.height) soul.y += soul.speed;
  }

  function updateBullets() {
    if (!isAttacking) return;

    for (let b of bullets) {
      b.x += b.vx;
      b.y += b.vy;

      if (b.y > arenaCanvas.height + 20) {
        b.y = -10;
        b.x = Math.random() * 560 + 20;
      }

      // Проверка столкновения с душой
      const dist = Math.hypot(b.x - soul.x, b.y - soul.y);
      if (dist < b.radius + soul.size / 2) {
        playerHp = Math.max(0, playerHp - 1);
        updateHPDisplay();
        if (playerHp <= 0) {
          alert('Игра окончена!');
          location.reload();
        }
      }
    }
  }

  function drawArena() {
    arenaCtx.clearRect(0, 0, arenaCanvas.width, arenaCanvas.height);

    if (isAttacking) {
      // Рисуем душу (красное сердце)
      arenaCtx.fillStyle = soul.color;
      arenaCtx.beginPath();
      arenaCtx.arc(soul.x, soul.y, soul.size / 2, 0, Math.PI * 2);
      arenaCtx.fill();

      // Рисуем снаряды воздуха
      arenaCtx.fillStyle = 'rgba(200, 230, 255, 0.8)';
      arenaCtx.strokeStyle = '#fff';
      for (let b of bullets) {
        arenaCtx.beginPath();
        arenaCtx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        arenaCtx.fill();
        arenaCtx.stroke();
      }
    }
  }

  function gameLoop() {
    drawBoss();
    updateSoul();
    updateBullets();
    drawArena();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
